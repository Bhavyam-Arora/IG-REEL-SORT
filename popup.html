<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="ranks" id="ranks" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>
    <div class="titles">
      <h1>Sortcut</h1>
      <p class="sub">Instagram research</p>
    </div>
  </header>

  <main>
    <label class="field">
      <span class="lbl">Rank by</span>
      <select id="sortBy">
        <option value="views">Views</option>
        <option value="outlier">Outlier score &middot; views</option>
        <option value="likes">Likes</option>
        <option value="outlierLikes">Outlier score &middot; likes</option>
        <option value="comments">Comments</option>
        <option value="outlierComments">Outlier score &middot; comments</option>
      </select>
    </label>

    <label class="field">
      <span class="lbl">Depth</span>
      <select id="limit">
        <option value="25">25 reels &middot; fast</option>
        <option value="50">50 reels</option>
        <option value="100" selected>100 reels</option>
        <option value="200">200 reels</option>
        <option value="300">300 reels &middot; slow</option>
        <option value="all">All reels &middot; slowest</option>
      </select>
    </label>

    <button id="go" class="primary">Sort reels</button>

    <div id="pageNote" class="status bad" role="alert" hidden></div>
    <div id="status" class="status" role="status" hidden></div>
    <div id="txStatus" class="status" role="status" hidden></div>

    <div class="exports">
      <button id="csv" class="ghost" disabled>Export CSV</button>
      <button id="json" class="ghost" disabled>Export JSON</button>
      <button id="xlsx" class="ghost" disabled>Export Excel</button>
      <button id="sheets" class="ghost wide" disabled>Export to Google Sheets</button>
    </div>
    <div id="sheetsStatus" class="status" role="status" hidden></div>
    <button id="sheetsCsv" class="link" hidden>Download CSV instead</button>

    <button id="restore" class="link" hidden>Restore original grid</button>

    <section class="account" aria-label="Account">
      <span class="lbl">Account</span>
      <div id="signedOut" hidden>
        <button id="signIn" class="ghost">Sign in with Google</button>
      </div>
      <div id="signedIn" hidden>
        <div class="who">
          <span id="email" class="mono"></span>
          <span id="plan" class="plan"></span>
        </div>
        <p id="usage" class="dim" hidden></p>
        <button id="signOut" class="link">Sign out</button>
      </div>
      <!-- The popup's one way to Pro, for anyone not on it, signed in or not. -->
      <a id="upgrade" class="upgrade" href="https://sortcut.co/pricing.html" target="_blank" rel="noopener" hidden>Upgrade to Pro</a>
      <p id="accountNote" class="dim" role="status" hidden></p>
    </section>

    <!-- Developer capture: shown only when storage has devCapture: true. See README. -->
    <button id="debugSample" class="ghost" hidden>Save debug sample</button>

    <details class="tools">
      <summary>Transcription</summary>
      <p class="dim">
        Reels you transcribe are sent to Sortcut and Groq to be transcribed, and
        deleted after processing.
      </p>
    </details>
  </main>

  <footer>
    <p>Sorting runs entirely in your browser.</p>
    <p class="dim">Not affiliated with or endorsed by Instagram.</p>
  </footer>

  <!-- For the shared reels-tab URL check; the extractor itself goes unused here. -->
  <script src="lib/extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
